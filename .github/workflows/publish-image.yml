name: Build, Publish & Security Scan

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: |
            ghcr.io/exefncs2/sporevault:latest
            ghcr.io/exefncs2/sporevault:fedora45
            ghcr.io/exefncs2/sporevault:${{ github.sha }}

      - name: Trivy Filesystem & Rust Dependency Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'MEDIUM,HIGH,CRITICAL'
          exit-code: '0'

      - name: Trivy Container Image CVE Scan (GHCR)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'ghcr.io/exefncs2/sporevault:latest'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '0'
